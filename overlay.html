<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Scoreboard Overlay - Ocean Theme</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scoreboard-box {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #021526 0%, #032541 100%);
      color: #fff;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 180, 216, 0.2);
      border: 1px solid rgba(0, 180, 216, 0.4);
      padding: 0;
      overflow: hidden;
    }

    .team {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      height: 60px;
    }

    .team-name {
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #e0f7fa;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .score-container {
      background: linear-gradient(180deg, #0077b6 0%, #03045e 100%);
      min-width: 55px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .score {
      font-family: 'Teko', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #90e0ef;
      text-shadow: 0 0 10px rgba(144, 224, 239, 0.5);
      line-height: 1;
    }

    .divider {
      width: 3px;
      height: 40px;
      background: rgba(0, 180, 216, 0.3);
    }

    .info-box {
      background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
      margin-left: -5px;
    }

    .period {
      font-family: 'Teko', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding-left: 8px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="scoreboard-box">
    <!-- ÉQUIPE A -->
    <div class="team">
      <span class="team-name" id="teamA">EQUIPE A</span>
    </div>
    <div class="score-container">
      <span class="score" id="scoreA">0</span>
    </div>

    <!-- SÉPARATEUR -->
    <div class="divider"></div>

    <!-- ÉQUIPE B -->
    <div class="score-container">
      <span class="score" id="scoreB">0</span>
    </div>
    <div class="team">
      <span class="team-name" id="teamB">EQUIPE B</span>
    </div>

    <!-- BADGE PÉRIODE -->
    <div class="info-box">
      <span class="period" id="period">Q1</span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://scoreboard-live-98477-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const scoreRef = ref(db, 'scoreboard');

    onValue(scoreRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.teamA !== undefined) document.getElementById('teamA').innerText = data.teamA;
        if (data.teamB !== undefined) document.getElementById('teamB').innerText = data.teamB;
        if (data.scoreA !== undefined) document.getElementById('scoreA').innerText = data.scoreA;
        if (data.scoreB !== undefined) document.getElementById('scoreB').innerText = data.scoreB;
        if (data.period !== undefined) document.getElementById('period').innerText = data.period;
      }
    });
  </script>
</body>
</html>
