<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard Admin</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121214; color: #fff; margin: 0; padding: 15px; }
    h1 { text-align: center; font-size: 1.2rem; color: #888; margin-bottom: 20px; }
    .card { background: #1e1e24; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
    label { font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; background: #2a2a32; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 1rem; }
    
    .score-display { text-align: center; font-size: 2.5rem; font-weight: bold; margin: 10px 0; color: #ff4d4d; }
    
    .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .btn-group-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    
    button { color: white; border: none; padding: 10px 5px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    button:active { opacity: 0.8; }
    
    .btn-minus { background: #3a2228; color: #ff6b6b; border: 1px solid #5c2b35; }
    .btn-plus { background: #c1121f; }
    .btn-plus-accent { background: #780000; }
    
    .btn-3pts { 
      background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%); 
      color: #000; 
      font-size: 1.05rem; 
      padding: 12px; 
      margin-top: 10px; 
      width: 100%; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(251, 133, 0, 0.4);
    }

    .btn-reset {
      background: #dc3545;
      color: #fff;
      font-size: 1rem;
      padding: 12px;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid #ff4d4d;
      transition: background 0.2s ease;
    }
    .btn-reset:hover {
      background: #b02a37;
    }
  </style>
</head>
<body>

  <h1>SCOREBOARD CONTROL</h1>

  <!-- ÉQUIPES ET SCORES -->
  <div class="grid">
    <!-- ÉQUIPE DOMICILE -->
    <div class="card">
      <label>ÉQUIPE DOMICILE</label>
      <input type="text" id="teamA_name" value="EQUIPE A" oninput="updateData()">
      
      <div class="score-display" id="scoreA_val">0</div>
      
      <label style="text-align: center; margin-top: 5px;">AJOUTER / RETIRER</label>
      <div class="btn-group">
        <button class="btn-minus" onclick="changeScore('A', -1)">-1</button>
        <button class="btn-minus" onclick="changeScore('A', -2)">-2</button>
        <button class="btn-minus" onclick="changeScore('A', -3)">-3</button>
      </div>
      <div class="btn-group">
        <button class="btn-plus" onclick="changeScore('A', 1)">+1</button>
        <button class="btn-plus-accent" onclick="changeScore('A', 2)">+2</button>
      </div>
      
      <!-- BOUTON 3PTS -->
      <button class="btn-3pts" onclick="trigger3PTR('A')">🏀 +3 PTS (ANIMATION)</button>
    </div>

    <!-- ÉQUIPE EXTÉRIEUR -->
    <div class="card">
      <label>ÉQUIPE EXTÉRIEUR</label>
      <input type="text" id="teamB_name" value="EQUIPE B" oninput="updateData()">
      
      <div class="score-display" id="scoreB_val">0</div>
      
      <label style="text-align: center; margin-top: 5px;">AJOUTER / RETIRER</label>
      <div class="btn-group">
        <button class="btn-minus" onclick="changeScore('B', -1)">-1</button>
        <button class="btn-minus" onclick="changeScore('B', -2)">-2</button>
        <button class="btn-minus" onclick="changeScore('B', -3)">-3</button>
      </div>
      <div class="btn-group">
        <button class="btn-plus" onclick="changeScore('B', 1)">+1</button>
        <button class="btn-plus-accent" onclick="changeScore('B', 2)">+2</button>
      </div>

      <!-- BOUTON 3PTS -->
      <button class="btn-3pts" onclick="trigger3PTR('B')">🏀 +3 PTS (ANIMATION)</button>
    </div>
  </div>

  <!-- PÉRIODE / QUART-TEMPS -->
  <div class="card">
    <label>PÉRIODE / QT</label>
    <input type="text" id="period" value="Q1" oninput="updateData()">
    <div class="btn-group-2">
      <button class="btn-minus" onclick="changePeriod(-1)">-1 QT</button>
      <button class="btn-plus-accent" onclick="changePeriod(1)">+1 QT</button>
    </div>
  </div>

  <!-- ACTIONS GLOBALES (RÉINITIALISATION) -->
  <div class="card">
    <label>ACTIONS MATCH</label>
    <button class="btn-reset" onclick="resetMatch()">🔄 Réinitialiser le Match (Scores à 0 & Q1)</button>
  </div>

  <!-- PERSONNALISATION DE L'APPARENCE -->
  <div class="grid">
    <div class="card">
      <label>THÈME COULEUR</label>
      <select id="theme_select" onchange="updateData()">
        <option value="nhbs-red">🔴 NHBS Red (Rouge & Noir)</option>
        <option value="ocean-blue">🔵 Ocean Blue (Bleu Cyan)</option>
        <option value="dark-gold">🟡 Dark Gold (Noir & Or)</option>
        <option value="emerald-green">🟢 Emerald Green (Vert Émeraude)</option>
      </select>
    </div>

    <div class="card">
      <label>POLICE DE CARACTÈRES</label>
      <select id="font_select" onchange="updateData()">
        <option value="font-default">Teko / Montserrat (Par défaut)</option>
        <option value="font-impact">Impact (Athlétique Classique)</option>
        <option value="font-bebas">Bebas Neue (Style Basket / NBA)</option>
        <option value="font-chakra">Chakra Petch (Futuriste / Esport)</option>
        <option value="font-russo">Russo One (Bloc Imposeur)</option>
        <option value="font-oswald">Oswald (Épuré & Condensé)</option>
      </select>
    </div>
  </div>

  <!-- FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://scoreboard-live-98477-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const scoreRef = ref(db, 'scoreboard');

    let state = {
      teamA: "EQUIPE A",
      teamB: "EQUIPE B",
      scoreA: 0,
      scoreB: 0,
      periodNum: 1,
      period: "Q1",
      theme: "nhbs-red",
      font: "font-default",
      threePointer: null
    };

    onValue(scoreRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state = { ...state, ...data };
        document.getElementById('teamA_name').value = state.teamA || "EQUIPE A";
        document.getElementById('teamB_name').value = state.teamB || "EQUIPE B";
        document.getElementById('scoreA_val').innerText = state.scoreA !== undefined ? state.scoreA : 0;
        document.getElementById('scoreB_val').innerText = state.scoreB !== undefined ? state.scoreB : 0;
        document.getElementById('period').value = state.period || "Q1";
        document.getElementById('theme_select').value = state.theme || "nhbs-red";
        document.getElementById('font_select').value = state.font || "font-default";
      }
    });

    window.updateData = () => {
      state.teamA = document.getElementById('teamA_name').value;
      state.teamB = document.getElementById('teamB_name').value;
      state.period = document.getElementById('period').value;
      state.theme = document.getElementById('theme_select').value;
      state.font = document.getElementById('font_select').value;
      set(scoreRef, state);
    };

    window.changeScore = (team, delta) => {
      if (team === 'A') state.scoreA = Math.max(0, (state.scoreA || 0) + delta);
      if (team === 'B') state.scoreB = Math.max(0, (state.scoreB || 0) + delta);
      
      document.getElementById('scoreA_val').innerText = state.scoreA;
      document.getElementById('scoreB_val').innerText = state.scoreB;
      
      set(scoreRef, state);
    };

    window.trigger3PTR = (team) => {
      if (team === 'A') state.scoreA = (state.scoreA || 0) + 3;
      if (team === 'B') state.scoreB = (state.scoreB || 0) + 3;

      state.threePointer = {
        team: team,
        timestamp: Date.now()
      };

      document.getElementById('scoreA_val').innerText = state.scoreA;
      document.getElementById('scoreB_val').innerText = state.scoreB;

      set(scoreRef, state);
    };

    window.changePeriod = (delta) => {
      const currentPeriod = document.getElementById('period').value;
      const match = currentPeriod.match(/\d+/);
      
      if (match) {
        state.periodNum = parseInt(match[0], 10);
      } else if (!state.periodNum) {
        state.periodNum = 1;
      }

      state.periodNum = Math.max(1, state.periodNum + delta);
      state.period = "Q" + state.periodNum;
      
      document.getElementById('period').value = state.period;
      set(scoreRef, state);
    };

    window.resetMatch = () => {
      if (confirm("Voulez-vous vraiment réinitialiser les scores à 0 et le quart-temps à Q1 ?")) {
        state.scoreA = 0;
        state.scoreB = 0;
        state.periodNum = 1;
        state.period = "Q1";
        
        document.getElementById('scoreA_val').innerText = 0;
        document.getElementById('scoreB_val').innerText = 0;
        document.getElementById('period').value = "Q1";

        set(scoreRef, state);
      }
    };
  </script>
</body>
</html>
