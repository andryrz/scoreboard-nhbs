<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard Admin</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121214; color: #fff; margin: 0; padding: 15px; }
    h1 { text-align: center; font-size: 1.2rem; color: #888; margin-bottom: 20px; }
    .card { background: #1e1e24; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; background: #2a2a32; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 1rem; }
    .score-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .score-val { font-size: 2rem; font-weight: bold; }
    button { background: #0070f3; color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:active { opacity: 0.8; }
    button.danger { background: #e53e3e; }
    button.success { background: #38a169; }
    .timer-btn { width: 100%; margin-top: 10px; padding: 15px; font-size: 1.1rem; }
  </style>
</head>
<body>

  <h1>SCOREBOARD CONTROL</h1>

  <!-- ÉQUIPES ET SCORES -->
  <div class="grid">
    <div class="card">
      <label>ÉQUIPE DOMICILE</label>
      <input type="text" id="teamA_name" value="EQUIPE A" onchange="updateData()">
      <div class="score-controls">
        <button onclick="changeScore('A', -1)">-1</button>
        <span class="score-val" id="scoreA_val">0</span>
        <button onclick="changeScore('A', 1)">+1</button>
      </div>
    </div>

    <div class="card">
      <label>ÉQUIPE EXTÉRIEUR</label>
      <input type="text" id="teamB_name" value="EQUIPE B" onchange="updateData()">
      <div class="score-controls">
        <button onclick="changeScore('B', -1)">-1</button>
        <span class="score-val" id="scoreB_val">0</span>
        <button onclick="changeScore('B', 1)">+1</button>
      </div>
    </div>
  </div>

  <!-- PÉRIODE ET TIMER -->
  <div class="card">
    <div class="grid">
      <div>
        <label>PÉRIODE / QT</label>
        <input type="text" id="period" value="Q1" onchange="updateData()">
      </div>
      <div>
        <label>TEMPS (MM:SS)</label>
        <input type="text" id="timer_display" value="10:00" onchange="updateData()">
      </div>
    </div>
    <button class="success timer-btn" id="timer_btn" onclick="toggleTimer()">DÉMARRER CHRONO</button>
  </div>

  <!-- FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- CONFIGURATION FIREBASE ---
    const firebaseConfig = {
      databaseURL: "https://VOTRE_FIREBASE_ID-default-rtdb.firebaseio.com" // REMPLACER PAR VOTRE URL
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const scoreRef = ref(db, 'scoreboard');

    let state = {
      teamA: "EQUIPE A",
      teamB: "EQUIPE B",
      scoreA: 0,
      scoreB: 0,
      period: "Q1",
      timer: "10:00",
      isRunning: false
    };

    // Synchronisation initiale
    onValue(scoreRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state = { ...state, ...data };
        document.getElementById('teamA_name').value = state.teamA;
        document.getElementById('teamB_name').value = state.teamB;
        document.getElementById('scoreA_val').innerText = state.scoreA;
        document.getElementById('scoreB_val').innerText = state.scoreB;
        document.getElementById('period').value = state.period;
        document.getElementById('timer_display').value = state.timer;
        document.getElementById('timer_btn').innerText = state.isRunning ? "PAUSE CHRONO" : "DÉMARRER CHRONO";
        document.getElementById('timer_btn').className = state.isRunning ? "danger timer-btn" : "success timer-btn";
      }
    });

    window.updateData = () => {
      state.teamA = document.getElementById('teamA_name').value;
      state.teamB = document.getElementById('teamB_name').value;
      state.period = document.getElementById('period').value;
      state.timer = document.getElementById('timer_display').value;
      set(scoreRef, state);
    };

    window.changeScore = (team, delta) => {
      if (team === 'A') state.scoreA = Math.max(0, state.scoreA + delta);
      if (team === 'B') state.scoreB = Math.max(0, state.scoreB + delta);
      set(scoreRef, state);
    };

    window.toggleTimer = () => {
      state.isRunning = !state.isRunning;
      set(scoreRef, state);
    };
  </script>
</body>
</html>
